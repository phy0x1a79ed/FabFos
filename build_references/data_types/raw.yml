# raw:: -- the acquisition tier.
#
# One type per upstream FILE, not per download bundle. The finer granularity is
# deliberate: `mnxr_lookup` needs reac_prop and reac_xref but not chem_prop, and
# the atom mapping needs chem_prop but not rhea. Typing the bundle instead of the
# file makes every consumer depend on everything, and the DAG stops telling you
# what actually feeds what.
#
# Nothing here is produced by a transform in this repo -- each type's producer is
# a download (or, for metacyc, a verify-and-refuse over a licensed drop-in).
#
# See build_references/REFERENCES.md for which compiled reference consumes which.
types:
  acquired:
    properties:
      _: acquired verbatim from an upstream source; never derived here

  # -- MetaNetX 4.5 ----------------------------------------------------------
  metanetx_chem_prop:
    extends: [acquired]
    properties:
      _: MetaNetX metabolite properties -- MNXM, name, formula, charge, mass, InChI, SMILES
      ext: tsv
  metanetx_chem_xref:
    extends: [acquired]
    properties:
      _: MetaNetX metabolite cross-references (source-prefixed ids -> MNXM)
      ext: tsv
  metanetx_reac_prop:
    extends: [acquired]
    properties:
      _: MetaNetX reaction properties -- MNXR, equation, EC classifs, balance flags
      ext: tsv
  metanetx_reac_xref:
    extends: [acquired]
    properties:
      _: MetaNetX reaction cross-references (kegg.reaction / rhea / bigg / metacyc -> MNXR)
      ext: tsv

  # -- Rhea ------------------------------------------------------------------
  rhea2uniprot:
    extends: [acquired]
    properties:
      _: Rhea -> UniProtKB/Swiss-Prot DR mappings
      ext: tsv
  rhea2uniprot_trembl:
    extends: [acquired]
    properties:
      _: Rhea -> UniProtKB/TrEMBL DR mappings (gzipped; the bulk of the 35.7M rows)
      ext: gz

  # -- KOfam / KEGG ----------------------------------------------------------
  kofam_profiles_archive:
    extends: [acquired]
    properties:
      _: KOfam HMM profiles, as shipped (tarball; untarred by the compile step)
      ext: tar.gz
  kofam_ko_list:
    extends: [acquired]
    properties:
      _: KOfam KO list -- per-family reporting threshold, score type, definition (carries the EC tags)
      ext: tsv
  kegg_ko_to_kegg_r:
    extends: [acquired]
    properties:
      _: KO -> KEGG reaction, lifted from each KO flat-file's REACTION block via KEGG REST
      ext: tsv

  # -- UniRef ----------------------------------------------------------------
  uniref50_fasta:
    extends: [acquired]
    properties:
      _: UniRef50 cluster representative sequences
      ext: fasta.gz

  # -- MetaCyc (LICENSED) ----------------------------------------------------
  # These are NOT downloadable. Their acquire transform verifies a manual drop-in
  # and refuses with instructions; it must never fetch.
  licensed:
    extends: [acquired]
    properties:
      _: licensed third-party data -- manual drop-in, never fetched, never redistributed
  metacyc_flatfiles:
    extends: [licensed]
    properties:
      _: >-
        The MetaCyc flat-file distribution, as dropped in. THE ONE GIVEN of the whole
        build: everything else in the reference DAG is fetched or derived, and this is
        the only thing that cannot be, because it is licensed and not redistributable.
        Its acquire transform verifies and splits it; it must never fetch.
  metacyc_atom_mappings_smiles:
    extends: [licensed]
    properties:
      _: MetaCyc curated mapped reaction SMILES ([C:n]...>>...), the AAM ensemble's independent member
      ext: dat
  metacyc_reactions:
    extends: [licensed]
    properties:
      _: MetaCyc reactions flat-file; carries REACTION-DIRECTION, the direction ensemble's curated member
      ext: dat

  # -- Thermodynamics --------------------------------------------------------
  equilibrator_cache:
    extends: [acquired]
    properties:
      _: eQuilibrator compound cache. Pinned explicitly so a build is not silently dependent on the package's first-use fetch

  # -- Hosts -----------------------------------------------------------------
  # The genome/proteome halves are sequences::* (produced by acquire/host_genome
  # from an accession), so only the curated model needs a raw:: type.
  host_gem:
    extends: [acquired]
    properties:
      _: Curated genome-scale metabolic model for a host, as published (BiGG JSON)
      ext: json

  # -- Literature ------------------------------------------------------------
  # Benchmark condition sources. Each is a paper's supplementary tables, not free text.
  literature_source:
    extends: [acquired]
    properties:
      _: a publication's supplementary tables, as downloaded
  laser_records:
    extends: [literature_source]
    properties:
      _: LASER engineering records (an upstream git checkout, pinned by url+sha256)
  keio_records:
    extends: [literature_source]
    properties:
      _: Keio single-gene knockout collection supplementary tables (Baba 2006)
  eydallin_records:
    extends: [literature_source]
    properties:
      _: Eydallin 2010 screen hits
      ext: tsv
  het_screen_records:
    extends: [literature_source]
    properties:
      _: heterologous / metagenomic screening cohort source tables
