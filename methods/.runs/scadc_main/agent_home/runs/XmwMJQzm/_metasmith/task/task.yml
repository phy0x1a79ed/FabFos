        _:
        - effective-resistance significance vs the staged null (full-mixture SF p
          + per-row empirical p_emp, SF-interpolated across flanking size anchors,
          BH-q within element x style for schema parity only -- rank by effect size)
        ext: tsv
        fields:
        - N_hi
        - N_lo
        - at_floor
        - axis_id
        - delta_obs
        - element
        - fosmid
        - k_hi
        - k_lo
