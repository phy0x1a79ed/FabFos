          report (1/r_aug - 1/r_base)
        ext: tsv
        fields:
        - axis_id
        - delta_ieff
        - element
        - fosmid
        - g_aug
        - g_base
        - iter
        - n_added_rxns
        - sink_hub
        - source_hub
