      - netB_iECDH10B/base_*.pkl
    note: >-
      The four facets x four elements of element-resolved bipartite graph that
      the incumbent actually solves on. networkx.Graph, nodes ("rxn", mnxr) and
      ("met", mnxm), one float edge attribute w_C / w_N / w_S / w_P. On net A
      that weight is the raw atom-transit count; on net B it is the transit
      count times the per-reaction evidence weight E_full.
      DECLARED RATHER THAN COMPUTED, and this is the important part: these
      CANNOT be rebuilt from X. X withholds the atom mapping on purpose -- its
      own _provenance.json says "aam: WITHHELD -- the atom mapping is under
      test" -- and the transit count is exactly what X does not ship. Formulas
      and stoichiometry are not a substitute: a formula says which atoms a
      metabolite CONTAINS, not how many it inherited from that reaction's other
      participants, and `load_bipartite` deletes every w<=0 edge, so the atom
      mapping fixes connectivity and LCC membership rather than only weights.
