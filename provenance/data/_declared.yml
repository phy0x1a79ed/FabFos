# The declaration table: every data dependency of reads -> ECSPr results.
#
# This file is hand-edited and is the single source of truth. Per-item records
# under provenance/data/*.yml are GENERATED from it by
# transforms/build/_stage/build_ref_library.py, which also fills in `bytes` and
# `sha256` by measuring the real file. Do not hand-edit the generated records.
#
# `src` is where the bytes live TODAY. `dest` is the tiered path inside
# .awm/data/ref/. `type` is a metasmith data type; see data_types/ in the
# library, extended by ref.yml for the cross-domain types.
#
# `select` narrows a directory source. Without it a directory is taken whole.
# `exclude` drops paths under it. Both are glob patterns relative to `src`.

version: 1
library: .awm/data/ref

defaults:
  data_root: /home/tony/agentic_workspace/data/scadc

items:

  # ===================================================================
  # external/ -- someone else made it; we fetched it
  # ===================================================================

  - id: metanetx.reac_prop
    src: references/metanetx/reac_prop.tsv
    dest: external/metanetx/4.5/reac_prop.tsv
    type: ecspr::metanetx_reac_prop
    tier: external
    kind: external
    url: https://www.metanetx.org/ftp/4.5/reac_prop.tsv
    version: "4.5"
    release_date: "2025-08-13"
    license: CC-BY 4.0
    note: >-
      The reaction universe (~83,796 rows) the whole ECSPr graph is built on.
      Its sha256 is ALSO pinned in mnxref-4_5/MANIFEST.json (reac_prop_sha256)
      and in canon; this record is the single source and the other two are
      checked against it.

  - id: metanetx.chem_prop
    src: references/metanetx/chem_prop.tsv
    dest: external/metanetx/4.5/chem_prop.tsv
    type: ecspr::metanetx_chem_prop
    tier: external
    kind: external
    url: https://www.metanetx.org/ftp/4.5/chem_prop.tsv
    version: "4.5"
    release_date: "2025-08-13"
    license: CC-BY 4.0

  - id: metanetx.chem_xref
    src: references/metanetx/chem_xref.tsv
    dest: external/metanetx/4.5/chem_xref.tsv
    type: ref::metanetx_chem_xref
    tier: external
    kind: external
    url: https://www.metanetx.org/ftp/4.5/chem_xref.tsv
    version: "4.5"
    release_date: "2025-08-13"
    license: CC-BY 4.0

  - id: metanetx.reac_xref
    src: references/metanetx/reac_xref.tsv
    dest: external/metanetx/4.5/reac_xref.tsv
    type: ecspr::metanetx_reac_xref
    tier: external
    kind: external
    url: https://www.metanetx.org/ftp/4.5/reac_xref.tsv
    version: "4.5"
    release_date: "2025-08-13"
    license: CC-BY 4.0
    note: the lane -> MNXR crosswalk

  - id: uniref50.fasta
    src: references/uniref50/uniref50.fasta.gz
    dest: external/uniref50/uniref50.fasta.gz
    type: ref::protein_fasta_gz
    tier: external
    kind: external
