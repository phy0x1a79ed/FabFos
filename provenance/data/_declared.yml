    src: repo/data/reference/hosts/e_coli_epi300/gem_identity_report.md
    dest: compiled/hosts/e_coli_epi300/gem_identity_report.md
    type: ref::host_gem_identity_report
    tier: reference
    kind: derived
    producer: build_references/check_epi300_identity.py
    determinism: reproducible
    note: >-
      EPI300 has no curated model of its own and needs none. Measured against the genome
      announcement (doi 10.1128/mra.01124-25) and both genomes, the EPI300<->DH10B delta
      is three genes lost (yfdH, rhsA, ypjCB) and three gained (araC, dfrA1, trfA), and
      none of the six is a model gene; no model gene is absent from EPI300. This report
      is that measurement, re-run on every build. It is declared because it is what
      makes two hosts' GEM tables legitimately identical rather than accidentally so.

