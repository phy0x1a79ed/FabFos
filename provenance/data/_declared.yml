      REPOINTED TO TIER 4, 2026-07-20. This previously resolved to
      04_reaction_network/cache -- the incumbent STAR graph, dated 13 June,
      weighted from aam_unified_expanded.tsv. That is the graph
      build_atom_graph.py's docstring indicts for fabricating transits for
