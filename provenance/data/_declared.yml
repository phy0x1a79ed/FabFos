    determinism: reproducible
    note: >-
      K-12's CLEAN file carries a writer defect on 350 lines: a protein description
      leaked into the EC field and got quoted, leaving the real prediction's ORF id
      reading `"NP_414593.1`. Left alone that is not a parse error but an identity
      split -- the deployed table ships 3,879 gene ids for 3,792 real ORFs because of
      it. The reader disables quoting, strips the stray quotes and reports the count.

