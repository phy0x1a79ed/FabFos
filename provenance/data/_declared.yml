      So the benchmark's headline result (specificity AUC 0.83-0.92, recorded in
      reports/benchmark_v3_result.md) was scored against a universe the method
      itself had disowned. That report is kept and annotated rather than deleted.

      This is a two-generation jump, not one, and it is the substantive change:
      16-21% of the edge set turns over per element (Jaccard C 0.808, N 0.822,
      S 0.836, P 0.792). By comparison tier 3 -> tier 4 moves 0.2-0.4%. Anyone
      attributing an AUC shift to "adopting tier 4" should read those two numbers
