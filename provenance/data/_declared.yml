    determinism: reproducible
    degraded_mode: >-
      All three de-novo tables carry three of their four declared lanes. The fourth,
      pbert_transfer, needs reference_label_pool -- a labelled reference proteome
      embedded with the same model as the query -- which has no producer and no staged
      file here and cannot be derived from the reference data that is. The lane is
      declared in build_references/lanes.yml and reported unavailable by name on every
      build, so the gap is visible rather than read as a smaller table.
