    version: "4.5"
    release_date: "2025-08-13"
    license: CC-BY 4.0
    note: >-
      The reaction universe (~83,796 rows) the whole ECSPr graph is built on.
      Its sha256 is ALSO pinned in mnxref-4_5/MANIFEST.json (reac_prop_sha256)
      and in canon; this record is the single source and the other two are
      checked against it.

