  # The three metabolism files are ONE artifact split across three, and are declared as
  # three because each is separately readable. They carry a byte-identical bake-identity
  # block and refs.assert_same_bake() refuses a mismatched set -- reading atom_pairs
  # against another bake's vocab decodes every node to the wrong metabolite and raises
  # nothing at all.
  - id: metabolism.compiled.vocab
    src: repo/data/reference/metabolism/vocab.parquet
    dest: compiled/metabolism/vocab.parquet
    type: ref::metabolism_vocab
    tier: reference
    kind: derived
    producer: build_references/bake_metabolism.py
    inputs: [metanetx.reac_prop]
    determinism: reproducible
    note: >-
      Five id spaces (element, met, rxn, method, source), each densely coded WITHIN its
      kind. The reaction space is the UNION of the atom-pair and direction tables:
      20,175 reactions carry direction evidence and no atom pairs, and coding against
      the smaller set would drop them into the ratio 1.0 default -- fully reversible,
      i.e. more conductance than the evidence supports.

  - id: metabolism.compiled.atom_pairs
    src: repo/data/reference/metabolism/atom_pairs.parquet
    dest: compiled/metabolism/atom_pairs.parquet
    type: ref::atom_pairs
    tier: reference
    kind: derived
    producer: build_references/bake_metabolism.py
    inputs: [metabolism.compiled.vocab]
    determinism: reproducible
    note: >-
      2,455,235 atom correspondences, int-coded against vocab, sorted, one parquet row
      group per element so the element filter prunes row groups. Metabolite and atom
      rank are stored as SEPARATE columns and packed into a node code at load time:
      packing at rest destroys parquet's dictionary encoding on the metabolite column
      (16.75 MB against 9.51 MB) and packing at load costs 4 ms. Orientation is stored
      as written -- the ratio > 1 edge flip stays a consumer-side operation, because a
      bake that pre-flipped would double-apply against a consumer that also flips.

  - id: metabolism.compiled.direction
    src: repo/data/reference/metabolism/direction.parquet
    dest: compiled/metabolism/direction.parquet
    type: ref::direction_ratios
    tier: reference
    kind: derived
    producer: build_references/bake_metabolism.py
    inputs: [metabolism.compiled.vocab]
    determinism: reproducible
    note: >-
      ratio = g_rev/g_fwd = exp(dG'/RT), against the direction the equation is WRITTEN
      in, so ratio > 1 FLIPS the edge rather than amplifying it. Kept at float64 while
      pair_w narrows to float32: the consumer's test is a threshold at exactly 1.0, and
      four reactions sit within float32 epsilon of it, so narrowing silently reorients
      four edges. dir_tier is what distinguishes "no directional evidence" from
      "evidence says reversible", which ratio == 1.0 alone cannot.

