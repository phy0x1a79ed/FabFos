    license: CC-BY 4.0
    note: >-
      12 GB. The single largest external fetch and the long pole on a fresh
      machine.

  - id: kofam.ko_list
    src: references/kofam/ko_list
    dest: external/kofam/ko_list
    type: ref::kofam_release
    tier: external
    kind: external
    url: https://www.genome.jp/ftp/db/kofam/ko_list.gz
    license: CC-BY-SA 4.0

  - id: kofam.profiles
    src: references/kofam/profiles.tar.gz
    dest: external/kofam/profiles.tar.gz
    type: ref::kofam_release
    tier: external
    kind: external
    url: https://www.genome.jp/ftp/db/kofam/profiles.tar.gz
    license: CC-BY-SA 4.0
    note: >-
      The 7.2 GB untarred `profiles/` directory beside this tarball is NOT
      migrated -- it is a plain untar of these bytes. Untar to scratch at run
      time. Migrating both would cost 7.2 GB to store the same information
      twice.

  - id: esmc.weights
    src: cache/esmc_weights/esmc_600m.tgz
    dest: external/esmc/esmc_600m.tgz
    type: ref::model_weights_archive
    tier: external
    kind: external
    url: https://huggingface.co/EvolutionaryScale/esmc-600m-2024-12
    version: 600m-2024-12
    license: EvolutionaryScale Cambrian Open License
    note: >-
      Model weights as a loose archive. Contrast CLEAN, whose weights are baked
      into its image and therefore share that image's tier and its blocker.

  - id: rhea
    src: references/rhea
    dest: external/rhea
    type: ref::reference_database
    tier: external
    kind: external
    url: https://ftp.expasy.org/databases/rhea/
    license: CC-BY 4.0
    exclude: ["embeddings/**", "rxn/**"]
    note: >-
      Two exclusions, for two different reasons. embeddings/ (718 MB) is a
      computed product of the Rhea reaction SMILES, not an upstream download;
      it belongs in derived/ behind a build transform that does not exist yet.
      rxn/ (459 MB, 36,678 tiny files) is a plain untar of rhea-rxn.tar.gz,
      which IS migrating -- the same redundancy as kofam's profiles/. Untar to
      scratch at run time; carrying it would put 36k files in the manifest to
      store bytes we already have.

  - id: chebi
    src: references/chebi
    dest: external/chebi
    type: ref::reference_database
    tier: external
    kind: external
    url: https://ftp.ebi.ac.uk/pub/databases/chebi/
    license: CC-BY 4.0

  - id: modelseed
    src: references/modelseed
    dest: external/modelseed
    type: ref::reference_database
    tier: external
