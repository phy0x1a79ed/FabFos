note: '548 measured perturbations: 382 gain-of-function (LASER strain records plus 10 curated
  cases) and 166 loss-of-function (Keio deletions). A curation pass over v2 that resolves
  gene->reaction mapping against reaction chemistry rather than gene name alone; every call
  it makes is committed in the decision tables declared below rather than buried in a builder.
  DIRECTION LIVES IN `measured`, NOT `expected`: the `expected` column is blank for all 372
  LASER strain rows and populated only for the 10 curated cases. Distribution is 320 up /
  3 down / 49 unknown, so 491 of the 548 carry a usable direction. Nearly all sign contrast
  in the benchmark comes from the 166 uniformly-negative deletion conditions plus 3 strain
  rows -- the GOF arm is close to a pure "does this raise conductance toward its own target
  more than elsewhere" test. Its own CURATION.md states 387 observations; the file and README
  both say 382. The tables are right and the prose is stale.'
