note: 'The atom-mapped MetaNetX universe, per element, from which every base graph above is
  induced. Four elements; the benchmark scores C/N/S/P only. Staged because the GOF arm needs
  it at SOLVE time, not just at build time: `base_plus_reactions` re-reads the universe to
  find the reactions a condition inserts, so a GOF perturbation cannot be applied without
  it. A tree holding base graphs but no universe would build and then fail on the first of
  the 382 gain-of-function conditions.

  REPOINTED TO TIER 4, 2026-07-20. This previously resolved to 04_reaction_network/cache --
  the incumbent STAR graph, dated 13 June, weighted from aam_unified_expanded.tsv. That is
  the graph build_atom_graph.py''s docstring indicts for fabricating transits for structureless
  stubs, giving atom-transit edges to non-molecules that carry no atom, and treating pseudo-reactions
  as chemistry. It was never any tier of the honest reference lane; it predates all four.

  So the benchmark''s headline result (specificity AUC 0.83-0.92, recorded in reports/benchmark_v3_result.md)
  was scored against a universe the method itself had disowned. That report is kept and annotated
  rather than deleted.

  This is a two-generation jump, not one, and it is the substantive change: 16-21% of the
  edge set turns over per element (Jaccard C 0.808, N 0.822, S 0.836, P 0.792). By comparison
  tier 3 -> tier 4 moves 0.2-0.4%. Anyone attributing an AUC shift to "adopting tier 4" should
  read those two numbers together -- this run is far more about abandoning the star.

  CONSEQUENCE: the frozen v3 answer key was derived under the star universe and is re-frozen
